name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: npm install
      - run: python -m pip install build pytest
      - run: npm run release
      - run: npm publish --workspace @splicemood/alphabet --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
      - run: mkdir -p dist && tar --exclude-vcs --exclude=node_modules --exclude=dist -czf "dist/splicemood-alphabet-go-${GITHUB_REF_NAME}.tar.gz" go.mod data scripts README.md LICENSE */alphabet.go */alphabet_test.go
      - run: gh release upload "$GITHUB_REF_NAME" "dist/splicemood-alphabet-go-${GITHUB_REF_NAME}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
