name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: npm install
      - run: python -m pip install build pytest
      - name: Check release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const js = JSON.parse(fs.readFileSync("packages/js/package.json", "utf8"));
          const pyproject = fs.readFileSync("packages/python/pyproject.toml", "utf8");
          const versionFile = fs.readFileSync("VERSION", "utf8").trim();
          const errors = [];
          if (versionFile !== version) errors.push(`VERSION is ${versionFile}`);
          if (root.version !== version) errors.push(`package.json is ${root.version}`);
          if (js.version !== version) errors.push(`packages/js/package.json is ${js.version}`);
          if (!pyproject.includes(`version = "${version}"`)) errors.push("packages/python/pyproject.toml differs");
          if (errors.length > 0) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          NODE
      - run: npm run release
      - run: python -m build packages/python
      - name: Create Go module release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f */alphabet.go */alphabet_test.go
          git commit -m "release: ${TAG} generated go sources"
          git tag -a "$TAG" -m "$TAG"
      - run: npm publish --workspace @splicemood/alphabet --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
      - name: Publish Go tag and GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          git push origin "$TAG"
          mkdir -p dist
          tar --exclude-vcs --exclude=node_modules --exclude=dist -czf "dist/splicemood-alphabet-go-${TAG}.tar.gz" go.mod data scripts README.md LICENSE */alphabet.go */alphabet_test.go
          gh release create "$TAG" "dist/splicemood-alphabet-go-${TAG}.tar.gz" --verify-tag --title "$TAG" --notes "SpliceMood Alphabet ${TAG}"
      - name: Verify Go module at tag
        env:
          VERSION: ${{ inputs.version }}
          GOPROXY: direct
          GONOSUMDB: github.com/splicemood/alphabet
        run: |
          TAG="v${VERSION}"
          CHECK_DIR="$(mktemp -d)"
          cd "$CHECK_DIR"
          go mod init release-check
          go list "github.com/splicemood/alphabet/ru@${TAG}"
          go list "github.com/splicemood/alphabet/rudigits@${TAG}"
