[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splicemood-alphabet"
version = "0.1.0"
description = "Stable Unicode alphabets for Nano ID, base-X encoders, visual IDs and localized tokens."
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "SpliceMood" }
]
keywords = [
  "alphabet",
  "unicode",
  "nanoid",
  "base-x",
  "base-n",
  "ids",
  "tokens"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = []
readme = { text = "Stable Unicode alphabets generated from data/alphabets.json. See https://github.com/splicemood/alphabet.", content-type = "text/markdown" }

[project.urls]
Homepage = "https://github.com/splicemood/alphabet"
Repository = "https://github.com/splicemood/alphabet"
Documentation = "https://splicemood.github.io/alphabet/"

[tool.hatch.build.targets.wheel]
packages = ["src/splicemood_alphabet"]
